name: Release

# Push a tag like v0.1.0-alpha.1 to publish a build.
# Tags with a hyphen (alpha/beta/rc) are published as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0-alpha.1"
        required: true

permissions:
  contents: write

# B20 native module: pinned NDK and CMake (keep in sync with app/build.gradle.kts and ci.yml).
env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP downloads missing platforms.

      - name: Install pinned NDK + CMake
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare release keystore
        env:
          KEYSTORE_B64: ${{ secrets.REDLINE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.REDLINE_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/redline.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          elif [ -n "$KEYSTORE_PASSWORD" ] && [ -f signing/redline-release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
              -in signing/redline-release.jks.enc -out "$KS" -pass env:KEYSTORE_PASSWORD
          fi
          if [ -s "$KS" ]; then
            echo "REDLINE_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            echo "Signing with the Redline release key."
          else
            echo "::warning::No release keystore available - release APK is signed with a debug key (sideload only)."
          fi

      - name: Build release APK + AAB
        env:
          REDLINE_KEYSTORE_PASSWORD: ${{ secrets.REDLINE_KEYSTORE_PASSWORD }}
          REDLINE_KEY_ALIAS: ${{ secrets.REDLINE_KEY_ALIAS }}
          REDLINE_KEY_PASSWORD: ${{ secrets.REDLINE_KEY_PASSWORD }}
        run: >
          ./gradlew --stacktrace
          -Predline.versionName=${{ steps.tag.outputs.version }}
          -Predline.versionCode=${{ github.run_number }}
          :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Redline-${{ steps.tag.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/Redline-${{ steps.tag.outputs.version }}.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Redline ${{ steps.tag.outputs.version }}
          prerelease: ${{ steps.tag.outputs.pre }}
          generate_release_notes: true
          files: dist/*
