name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP downloads missing platforms.

      - uses: gradle/actions/setup-gradle@v4

      - name: Build version info
        id: ver
        run: |
          echo "name=0.0.0-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Assemble debug, unit tests, lint
        run: >
          ./gradlew --stacktrace
          -Predline.versionName=${{ steps.ver.outputs.name }}
          -Predline.versionCode=${{ steps.ver.outputs.code }}
          :app:ktlintCheck :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: redline-debug-${{ steps.ver.outputs.code }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.ver.outputs.code }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  calibration:
    name: Calibration toolkit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r calibration/requirements-ci.txt
      - run: python -m pytest calibration -q

  instrumented:
    name: Emulator smoke test (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: ./gradlew --stacktrace :app:connectedDebugAndroidTest

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api${{ matrix.api }}
          path: app/build/reports/androidTests/
          retention-days: 14
