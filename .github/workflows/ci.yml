name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# B20 native module: pinned NDK and CMake (keep in sync with ndkVersion / cmake version in app/build.gradle.kts).
env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"

jobs:
  android:
    name: Build, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); AGP downloads missing platforms.

      - name: Install pinned NDK + CMake
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # B30: the depth + segmentation models (not committed): converted from the pinned, checksum-verified checkpoint and
      # cached; a cache miss installs TensorFlow (CPU) for the conversion and checks parity with the torch reference.
      - name: Cache on-device models
        uses: actions/cache@v4
        with:
          path: ~/.cache/redline-models
          key: redline-models-${{ hashFiles('tools/models/fetch_models.sh', 'tools/models/export_depth_anything_v2_small.py', 'tools/models/requirements.txt', 'tools/models/selfcheck_reference_depth.npy') }}

      # TensorFlow 2.19 has wheels for Python 3.9-3.12 only; ubuntu-latest's default python3 is newer.
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"

      - name: Fetch / build on-device models
        run: tools/models/fetch_models.sh
        env:
          PYTHON: ${{ steps.py312.outputs.python-path }}

      - name: Native host tests (CTest)
        run: |
          cmake -S app/src/test/cpp -B build/native-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host
          ctest --test-dir build/native-host --output-on-failure

      - name: Build version info
        id: ver
        run: |
          echo "name=0.0.0-ci.${GITHUB_RUN_NUMBER}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Assemble debug, unit tests, lint
        run: >
          ./gradlew --stacktrace
          -Predline.versionName=${{ steps.ver.outputs.name }}
          -Predline.versionCode=${{ steps.ver.outputs.code }}
          :app:ktlintCheck :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: redline-debug-${{ steps.ver.outputs.code }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.ver.outputs.code }}
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14

  calibration:
    name: Calibration toolkit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r calibration/requirements-ci.txt rawpy

      # B21/B22/B23/B24: host builds of the native RAW pipeline, burst merge, super-resolution merge and detail post-pass,
      # for the Python parity tests (tests/test_raw_pipeline.py, test_burst_merge.py, test_superres.py, test_detail.py).
      - name: Build native RAW pipeline + burst merge + super-resolution + detail host tools
        run: |
          cmake -S app/src/test/cpp -B build/native-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host --target raw_pipeline_tool burst_merge_tool superres_tool detail_tool depth_post_tool
          echo "REDLINE_RAW_TOOL=$PWD/build/native-host/raw_pipeline_tool" >> "$GITHUB_ENV"
          echo "REDLINE_BURST_TOOL=$PWD/build/native-host/burst_merge_tool" >> "$GITHUB_ENV"
          echo "REDLINE_SR_TOOL=$PWD/build/native-host/superres_tool" >> "$GITHUB_ENV"
          echo "REDLINE_DETAIL_TOOL=$PWD/build/native-host/detail_tool" >> "$GITHUB_ENV"
          echo "REDLINE_DEPTH_TOOL=$PWD/build/native-host/depth_post_tool" >> "$GITHUB_ENV"
          echo "REDLINE_REQUIRE_NATIVE=1" >> "$GITHUB_ENV"

      - name: Cache real-file fixtures
        uses: actions/cache@v4
        with:
          path: ~/redline-fixtures
          key: cal-fixtures-exiftool13.60-r5m2-raw-v1

      - name: Fetch exiftool + EOS R5 Mark II sample (raw.pixls.us, CC0)
        run: |
          mkdir -p ~/redline-fixtures && cd ~/redline-fixtures
          [ -d Image-ExifTool-13.60 ] || curl -fsSL "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-13.60.tar.gz/download" | tar xz
          [ -f RAW.CR3 ] || curl -fsSL -o RAW.CR3 "https://raw.pixls.us/data/Canon/Canon%20EOS%20R5m2/RAW.CR3"
          echo "$HOME/redline-fixtures/Image-ExifTool-13.60" >> "$GITHUB_PATH"
          echo "REDLINE_CAL_SAMPLE_CR3=$HOME/redline-fixtures/RAW.CR3" >> "$GITHUB_ENV"

      - run: python -m pytest calibration -q -rs

  instrumented:
    name: Emulator smoke test (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned NDK + CMake
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # B30: the depth + segmentation models (not committed): converted from the pinned, checksum-verified checkpoint and
      # cached; a cache miss installs TensorFlow (CPU) for the conversion and checks parity with the torch reference.
      - name: Cache on-device models
        uses: actions/cache@v4
        with:
          path: ~/.cache/redline-models
          key: redline-models-${{ hashFiles('tools/models/fetch_models.sh', 'tools/models/export_depth_anything_v2_small.py', 'tools/models/requirements.txt', 'tools/models/selfcheck_reference_depth.npy') }}

      # TensorFlow 2.19 has wheels for Python 3.9-3.12 only; ubuntu-latest's default python3 is newer.
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"

      - name: Fetch / build on-device models
        run: tools/models/fetch_models.sh
        env:
          PYTHON: ${{ steps.py312.outputs.python-path }}

      - name: Build test APKs
        run: ./gradlew --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          # B25: the Ultra HDR / HEIF test leaves its files in Downloads/RedlineCI; pull them for the host check.
          script: |
            ./gradlew --stacktrace :app:connectedDebugAndroidTest
            adb pull /sdcard/Download/RedlineCI uhdr-out

      # B25: validate the emulator's Ultra HDR JPEG with libultrahdr (Apache-2.0; CI only, not part of the app). v1.4.0 misses
      # an <cstdint> include that the runner's GCC no longer pulls in transitively, hence the forced include.
      - name: Validate Ultra HDR with libultrahdr (host)
        run: |
          sudo apt-get install -y --no-install-recommends libjpeg-turbo8-dev ninja-build > /dev/null
          git clone --depth 1 -b v1.4.0 https://github.com/google/libultrahdr.git build/libultrahdr-src
          cmake -G Ninja -S build/libultrahdr-src -B build/libultrahdr -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DUHDR_BUILD_EXAMPLES=OFF -DUHDR_BUILD_TESTS=OFF -DUHDR_ENABLE_INSTALL=OFF -DCMAKE_CXX_FLAGS="-include cstdint"
          cmake --build build/libultrahdr
          g++ -std=c++17 -O2 ci/uhdr_validate.cpp -Ibuild/libultrahdr-src -Lbuild/libultrahdr -luhdr -ljpeg -lpthread -lm \
            -o build/uhdr_validate
          ls -lR uhdr-out
          UHDR=$(find uhdr-out -name 'redline_ci_uhdr.jpg' | head -1)
          PLAIN=$(find uhdr-out -name 'redline_ci_plain.jpg' | head -1)
          test -n "$UHDR" && test -n "$PLAIN"
          build/uhdr_validate "$UHDR" 1.5
          build/uhdr_validate --not "$PLAIN"

      # B30: what the emulator measured (HEIF codec + time split, depth / segmentation timings and confidence).
      - name: Emulator measurements
        if: always()
        run: for f in $(find uhdr-out -name '*.json' 2>/dev/null); do echo "== $f"; cat "$f"; echo; done

      - name: Upload Ultra HDR / HEIF samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b25-format-samples-api${{ matrix.api }}
          path: uhdr-out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-api${{ matrix.api }}
          path: app/build/reports/androidTests/
          retention-days: 14
